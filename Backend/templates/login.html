<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Login - SchoolBus</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: #f1f5f9;
            overflow: hidden;
        }
        .login-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        .login-left {
            flex: 1.5;
            position: relative;
            background-color: #0f172a;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-left img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
        }
        .login-right {
            flex: 1;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 50px 60px;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.05);
            position: relative;
        }
        .login-form-wrapper {
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
        }
        .login-header {
            margin-bottom: 40px;
        }
        .login-header h2 {
            font-size: 28px;
            color: #0f172a;
            margin: 0 0 10px 0;
            font-weight: 700;
        }
        .login-header p {
            color: #64748b;
            margin: 0;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 24px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-control {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            color: #0f172a;
            transition: all 0.2s;
            box-sizing: border-box;
            background-color: #f8fafc;
        }
        .form-control:focus {
            border-color: #2563eb;
            background-color: #ffffff;
            outline: none;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
            margin-top: 10px;
        }
        .btn-login:hover {
            background-color: #1d4ed8;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.3);
            transform: translateY(-1px);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .error-message {
            background-color: #fef2f2;
            color: #dc2626;
            border: 1px solid #fee2e2;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 24px;
            font-weight: 500;
        }
        .copyright-box {
            position: absolute;
            bottom: 25px;
            right: 40px;
            text-align: right;
            line-height: 1.6;
        }
        .copyright-line1 {
            font-size: 12px;
            color: #64748b;
            font-weight: 600;
        }
        .copyright-line2 {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 500;
        }
        
        @media (max-width: 900px) {
            .login-left {
                display: none;
            }
            .login-right {
                flex: 1;
                padding: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Left Side: Image -->
        <div class="login-left">
            <img src="/image/Login_image.jpg" alt="Login Background">
        </div>
        
        <!-- Right Side: Form -->
        <div class="login-right">
            <div class="login-form-wrapper">
                <div class="login-header">
                    <h2>SchoolBus System</h2>
                    <p>Admin &amp; Management Portal Login</p>
                </div>
                
                {% if error %}
                    <div class="error-message">
                        {{ error }}
                    </div>
                {% endif %}
                
                <form action="/login" method="POST">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" class="form-control" placeholder="Enter username..." required autocomplete="username">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="Enter password..." required autocomplete="current-password">
                    </div>
                    
                    <button type="submit" class="btn-login">SIGN IN</button>
                </form>
            </div>
            
            <!-- Bottom Right Copyright metadata -->
            <div class="copyright-box">
                <div class="copyright-line1">© Hà Văn Đạt</div>
                <div class="copyright-line2">Advisor: Phùng Văn Quyền</div>
            </div>
        </div>
    </div>
</body>
</html>
